[package]
name = "volcano-daemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "HTTP daemon holding the single BLE connection to a Storz & Bickel vaporizer"
license = "MIT"
repository = "https://github.com/rivavolt/storz-rs"

[[bin]]
name = "volcano-daemon"
path = "src/main.rs"

[dependencies]
storz-rs = { workspace = true, features = ["serde"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = "0.8"

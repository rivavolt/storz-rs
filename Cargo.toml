[package]
name = "storz-rs"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
description = "Rust library for controlling Storz & Bickel vaporizers via Bluetooth Low Energy"
license = "MIT"
repository = "https://github.com/flakesonnix/storz-rs"
keywords = ["bluetooth", "ble", "vaporizer", "iot", "btleplug"]
categories = ["hardware-support", "api-bindings"]

[workspace]
members = [".", "cli", "daemon", "mcp"]

[workspace.dependencies]
storz-rs = { path = "." }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
serde = ["dep:serde"]
client = ["serde", "dep:reqwest", "dep:serde_json"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"], optional = true }
btleplug = "0.11"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
tracing = "0.1"
futures = "0.3"
async-trait = "0.1"
tokio-stream = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = "0.3"

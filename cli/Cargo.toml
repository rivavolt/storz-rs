[package]
name = "volcano-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "CLI for controlling Storz & Bickel vaporizers (Volcano Hybrid, Venty, Crafty) over BLE"
license = "MIT"
repository = "https://github.com/rivavolt/storz-rs"

[[bin]]
name = "volcano"
path = "src/main.rs"

[dependencies]
storz-rs = { workspace = true, features = ["serde", "client"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }

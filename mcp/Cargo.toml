[package]
name = "volcano-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "MCP server exposing Storz & Bickel vaporizer control (Volcano Hybrid, Venty, Crafty) over BLE"
license = "MIT"
repository = "https://github.com/rivavolt/storz-rs"

[[bin]]
name = "volcano-mcp"
path = "src/main.rs"

[dependencies]
storz-rs = { workspace = true, features = ["serde", "client"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rmcp = { version = "3", features = ["server", "macros", "transport-io"] }
schemars = "1"
